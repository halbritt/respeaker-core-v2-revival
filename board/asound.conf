# ALSA defaults for the ReSpeaker Core v2 under the mainline kernel.
# Playback goes to the SoC codec (speaker connector and 3.5 mm jack), which has no hardware
# volume, so "Speaker" is a software control, from -40 dB to +12 dB (above 0 dB loud
# passages clip): amixer sset Speaker 80%
# The codec shares its I2S controller with the microphones: while they are recording,
# playback runs at their rate (16 kHz); plug converts whatever is played.
pcm.speaker {
	type softvol
	slave.pcm "plughw:0,1"
	control { name "Speaker"; card 0 }
	min_dB -40.0
	max_dB 12.0
}
pcm.!default {
	type asym
	playback.pcm { type plug; slave.pcm "speaker" }
	capture.pcm "plughw:0,0"
}
ctl.!default { type hw; card 0 }
